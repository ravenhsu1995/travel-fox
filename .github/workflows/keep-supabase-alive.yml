name: Keep Supabase Alive

# 免費方案專案閒置 7 天會被暫停，這裡每 3 天打一次 REST 端點保持活躍。
# 也可以在 Actions 頁面手動觸發 (workflow_dispatch) 測試。
on:
  schedule:
    - cron: '0 6 */3 * *' # 每 3 天 06:00 UTC 執行一次
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          code=$(curl -s -m 30 -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/trips?select=id&limit=1")
          if [ "$code" = "000" ] || [ -z "$code" ]; then
            echo "❌ Supabase 連不上 (HTTP $code) — 專案可能被暫停"
            exit 1
          fi
          echo "✅ Supabase 有回應 (HTTP $code) — 活躍計時已重置"
